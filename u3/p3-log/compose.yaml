name: practica-03-logs

services:
  # DNS - BIND9. No guarda archivo de log: todo sale por "docker logs dns"
  dns:
    image: ubuntu/bind9:latest
    container_name: dns
    hostname: ns1
    networks:
      red_logs:
        ipv4_address: ${DNS_IP}
    volumes:
      - ./bind/named.conf.options:/etc/bind/named.conf.options:ro
      - ./bind/named.conf.local:/etc/bind/named.conf.local:ro
      - ./bind/db.${DOMINIO}:/etc/bind/db.${DOMINIO}:ro
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    restart: unless-stopped

  # WEB - Apache con su pagina por defecto ("It works!").
  # Guarda sus logs DENTRO del contenedor: /usr/local/apache2/logs/
  web:
    image: httpd:alpine
    container_name: web
    hostname: web
    networks:
      red_logs:
        ipv4_address: ${WEB_IP}
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

  # DHCP - ISC dhcpd. No guarda archivo de log (sale por "docker logs dhcp"),
  # pero si guarda el archivo de arrendamientos: /data/dhcpd.leases
  dhcp:
    image: networkboot/dhcpd:latest
    container_name: dhcp
    hostname: dhcp
    networks:
      red_logs:
        ipv4_address: ${DHCP_IP}
    volumes:
      - ./dhcpd.conf:/data/dhcpd.conf:ro
    restart: unless-stopped

  # FTP - vsftpd. Guarda su log DENTRO del contenedor: /var/log/vsftpd.log
  ftp:
    image: fauria/vsftpd
    container_name: ftp
    hostname: ftp
    networks:
      red_logs:
        ipv4_address: ${FTP_IP}
    environment:
      - FTP_USER=${FTP_USER}
      - FTP_PASS=${FTP_PASS}
      - PASV_ADDRESS=${FTP_IP}
    ports:
      - "21:21"
    restart: unless-stopped

  # Clientes: piden IP por DHCP, tienen SSH y firewall (ufw) activo
  pc1:
    build:
      context: .
      dockerfile: Dockerfile.pc
      args:
        PC_ROOT_PASSWORD: ${PC_ROOT_PASSWORD}
    image: pc-logs-client:latest
    container_name: pc1
    hostname: pc1
    networks:
      red_logs:
        mac_address: 02:00:00:00:00:01   # MAC fija: el DHCP siempre le da la misma IP
    ports:
      - "${SSH_PC1_PORT}:22"
    cap_add:
      - NET_ADMIN
    depends_on: [dns, web, dhcp, ftp]
    restart: unless-stopped

  pc2:
    build:
      context: .
      dockerfile: Dockerfile.pc
      args:
        PC_ROOT_PASSWORD: ${PC_ROOT_PASSWORD}
    image: pc-logs-client:latest
    container_name: pc2
    hostname: pc2
    networks:
      red_logs:
        mac_address: 02:00:00:00:00:02   # MAC fija: el DHCP siempre le da la misma IP
    ports:
      - "${SSH_PC2_PORT}:22"
    cap_add:
      - NET_ADMIN
    depends_on: [dns, web, dhcp, ftp]
    restart: unless-stopped

networks:
  red_logs:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBRED}
