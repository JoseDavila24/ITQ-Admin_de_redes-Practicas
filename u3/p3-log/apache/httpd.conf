ServerRoot "/usr/local/apache2"
Listen 80
ServerName web.chema.osvp

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so

User www-data
Group www-data

# Pagina por defecto de la imagen ("It works!")
DocumentRoot "/usr/local/apache2/htdocs"
DirectoryIndex index.html
<Directory "/usr/local/apache2/htdocs">
    Require all granted
</Directory>

# Apache protege por defecto los archivos .ht* (.htaccess, .htpasswd) -> 403 Forbidden
<Files ".ht*">
    Require all denied
</Files>

# Formato del log: IP, fecha, peticion, codigo, bytes, User-Agent y tiempo (%D en microsegundos)
LogFormat "%h %t \"%r\" %>s %b \"%{User-Agent}i\" %Dus" practica

# Logs guardados DENTRO del contenedor en /usr/local/apache2/logs/
CustomLog "logs/access_log" practica
ErrorLog "logs/error_log"
LogLevel warn
