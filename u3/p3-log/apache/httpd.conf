ServerRoot "/usr/local/apache2"
Listen 80
ServerName web.chema.osvp

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so

User www-data
Group www-data

DocumentRoot "/usr/local/apache2/htdocs"

<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Directorio protegido para generar error 403 Forbidden
<Directory "/usr/local/apache2/htdocs/secreto">
    Require all denied
</Directory>

DirectoryIndex index.html

# Formato de log con tiempo de respuesta al final (%D = microsegundos)
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" rt=%D_us" detallado

# Logs guardados DENTRO del contenedor (/usr/local/apache2/logs/)
#   access_log -> una linea por peticion (IP, metodo, codigo, User-Agent, tiempo)
#   error_log  -> errores: 403 (AH01630 client denied) y 404 (AH00128 File does not exist)
CustomLog "logs/access_log" detallado
ErrorLog "logs/error_log"
LogLevel warn core:info
