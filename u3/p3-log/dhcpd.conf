# Concesion corta (2 min) para ver renovaciones automaticas cada ~1 min
authoritative;
default-lease-time 120;
max-lease-time 120;

# Antes de ofrecer una IP, el servidor hace ping: si alguien responde hay un conflicto
ping-check true;

subnet 192.168.30.0 netmask 255.255.255.0 {
    range 192.168.30.100 192.168.30.150;
    option routers 192.168.30.254;
    option domain-name-servers 192.168.30.4;
    option domain-name "chema.osvp";
}
