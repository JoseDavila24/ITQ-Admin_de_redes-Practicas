# Formato "combined" + %D (tiempo de respuesta en microsegundos)
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" combinedtime
CustomLog /usr/local/apache2/logs/access.log combinedtime
ErrorLog /usr/local/apache2/logs/error.log

# Directorio protegido -> 403 Forbidden
<Directory "/usr/local/apache2/htdocs/privado">
    Require all denied
</Directory>
