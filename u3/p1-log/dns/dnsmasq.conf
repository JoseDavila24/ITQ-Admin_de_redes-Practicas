# --- Solo DNS ---------------------------------------------------------------
# No hay "dhcp-range": dnsmasq NO hace DHCP y no choca con el DHCP de tu LAN.

# Upstream para consultas recursivas (no usa /etc/resolv.conf)
no-resolv
server=8.8.8.8
server=1.1.1.1

# Respuesta local para tu dominio: se define en el archivo .env
# (DOMINIO y DOMINIO_IP) y compose.yaml se la pasa a dnsmasq.

# Escucha en cada IP de cada interfaz y se adapta si DHCP le cambia la IP a
# Ubuntu. Se excluye "lo" para convivir con systemd-resolved (127.0.0.53),
# así NO hace falta detenerlo.
bind-dynamic
except-interface=lo

# Logs
log-queries=extra
log-facility=/var/log/dnsmasq.log
