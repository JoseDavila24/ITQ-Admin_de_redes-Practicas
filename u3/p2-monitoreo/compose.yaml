name: practica-u3-p2-monitoreo

# ---------------------------------------------------------------------------
# Práctica de captura de tráfico (Wireshark / tcpdump / tshark).
# HTTP y DNS  -> red del host (Ubuntu): el tráfico viaja por la LAN y se
#               captura en Fedora (cliente) o en Ubuntu.
# DHCP + PCs  -> red bridge AISLADA "red-dhcp" (interfaz br-dhcp en Ubuntu):
#               el tráfico solo existe dentro de Ubuntu, se captura ahí.
# No se puede levantar a la vez que u3/p1-log (mismos puertos y red).
# ---------------------------------------------------------------------------

services:

  # ----------------------------- Parte 1: HTTP -----------------------------
  web-server:
    image: httpd:alpine
    container_name: web-server
    hostname: web-server
    network_mode: host
    volumes:
      - ./http/generar-contenido.sh:/generar-contenido.sh:ro
    # Crea texto.txt, datos.json, imagen.png, grande.bin y carpeta/ y arranca Apache
    command: ["sh", "/generar-contenido.sh"]

  # ----------------------------- Parte 2: DNS ------------------------------
  dns-server:
    image: joelnb/dnsmasq:latest
    container_name: dns-server
    hostname: dns-server
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./dns/dnsmasq.conf:/etc/dnsmasq.conf:ro
    # El dominio local viene de .env. Si DOMINIO_IP está vacío, se usa la IP
    # con la que Ubuntu sale a la red (se detecta al arrancar el contenedor).
    environment:
      DOMINIO: ${DOMINIO:-chema.osvp}
      DOMINIO_IP: ${DOMINIO_IP:-}
    command:
      - sh
      - -c
      - |
        IP="$${DOMINIO_IP:-$$(ip route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($$i=="src") print $$(i+1)}')}"
        [ -z "$$IP" ] && echo "AVISO: no se detectó la IP de Ubuntu; pon DOMINIO_IP en .env"
        echo "dnsmasq: $$DOMINIO -> $$IP"
        exec /usr/sbin/dnsmasq --keep-in-foreground --address=/$$DOMINIO/$$IP

  # ----------------------------- Parte 3: DHCP -----------------------------
  kea-server:
    image: scjalliance/kea-dhcp4-minimal:3.2
    container_name: kea-server
    hostname: kea-server
    user: root
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      red-dhcp:
        ipv4_address: 192.168.50.2
    volumes:
      - ./dhcp/kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro
    # Borra un PID viejo (si el contenedor se reinició) para que Kea no crea que ya corre
    command: >
      sh -c "rm -f /var/run/kea/*.pid /run/kea/*.pid;
             exec kea-dhcp4 -c /etc/kea/kea-dhcp4.conf"

  pc1:
    build:
      context: .
      dockerfile: Dockerfile.pc
    image: pc-cliente:latest
    container_name: pc1
    hostname: pc1
    cap_add:
      - NET_ADMIN
    networks:
      - red-dhcp
    depends_on:
      - kea-server

  pc2:
    build:
      context: .
      dockerfile: Dockerfile.pc
    image: pc-cliente:latest
    container_name: pc2
    hostname: pc2
    cap_add:
      - NET_ADMIN
    networks:
      - red-dhcp
    depends_on:
      - kea-server

networks:
  red-dhcp:
    name: red-dhcp
    driver: bridge
    driver_opts:
      # Nombre fijo de la interfaz en Ubuntu -> para capturar con tcpdump
      com.docker.network.bridge.name: br-dhcp
    ipam:
      config:
        - subnet: 192.168.50.0/24
          # Docker solo reparte .1-.6; el pool de Kea (.10-.50) queda libre
          ip_range: 192.168.50.0/29
          gateway: 192.168.50.1
