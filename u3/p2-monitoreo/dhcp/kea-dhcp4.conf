{
  "Dhcp4": {
    "interfaces-config": { "interfaces": [ "eth0" ] },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv"
    },
    "valid-lifetime": 120,
    "renew-timer": 60,
    "rebind-timer": 90,
    "decline-probation-period": 60,
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.50.0/24",
        "pools": [ { "pool": "192.168.50.10 - 192.168.50.50" } ],
        "option-data": [
          { "name": "routers", "data": "192.168.50.1" },
          { "name": "domain-name-servers", "data": "8.8.8.8, 1.1.1.1" }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          { "output": "/var/log/kea/kea-dhcp4.log", "maxver": 5, "maxsize": 10485760, "flush": true }
        ],
        "severity": "DEBUG",
        "debuglevel": 50
      }
    ]
  }
}
